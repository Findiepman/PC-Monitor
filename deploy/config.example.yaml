# /etc/dashd/config.yaml
# Generate the auth block with `dashd init -o /etc/dashd/config.yaml`, then
# fill in the providers below. Remove a provider block to disable it.

listen: 127.0.0.1:7070   # keep on loopback; cloudflared connects locally
# hostname: findiepman-srv  # name in the top bar, defaults to the machine name

auth:
  username: fin
  password_hash: "$argon2id$v=19$..."   # from `dashd init` or `dashd hash-password`
  totp_secret: env:DASHD_TOTP_SECRET    # a literal value works too
  # How long a sign-in lasts. Sessions are saved to disk, so reboots don't
  # sign you out; only this expiry does.
  session_ttl: 168h
  sessions_path: /var/lib/dashd/sessions.json

audit:
  path: /var/lib/dashd/audit.jsonl

providers:
  docker:
    label: Docker
    socket: /var/run/docker.sock
    # Wings game server containers are hidden by default because the
    # pterodactyl provider shows them with proper names.
    exclude_labels: ["Service=Pterodactyl"]
    exclude: []

  systemd:
    label: Services
    # Allowlist. dashd can't see or touch any other unit. Mirror this list
    # in /etc/polkit-1/rules.d/50-dashd.rules.
    units:
      - wings
      - playit
      - pteroq
      - cloudflared

  pterodactyl:
    label: Pterodactyl
    url: https://panel.findiepman.dev
    # Client API key from Account > API Credentials (starts with ptlc_).
    api_key: env:DASHD_PTERODACTYL_KEY
    all_servers: false   # true lists every server, needs a root admin key

  # Discord bots (anything pm2 runs): a group in Services and their own
  # "Discord bots" page, with start/restart/stop. dashd can't reach pm2
  # itself, so deploy/dashd-pm2.service runs as the pm2 user: it writes the
  # list to `path` and takes the button presses on `control`.
  pm2:
    label: Discord bots
    path: /run/pm2-status/pm2.json
    control: /run/pm2-status/control.sock
    exclude: []   # pm2 names to hide, for apps that aren't bots

# One-line description shown on each service tile ("what is it, what does it
# do"). dashd already knows common services (wings, playit, pteroq,
# cloudflared, nginx, the Pterodactyl panel, MariaDB/MySQL, Postgres, Redis,
# Uptime Kuma, and a generic line for game servers). Add your own apps here or
# override a built-in one. Key: the unit's name ("strongroom") or its full id
# ("docker:strongroom", "systemd:wings.service"); a bare name matches in
# every provider. An empty value hides the
# line. Restart dashd after editing: sudo systemctl restart dashd
# about:
#   strongroom: "What strongroom does, in one line."
#   kivo-roadmap: "What kivo-roadmap does, in one line."
#   systemd:wings.service: "Your own wording for Wings."
#   redis: ""
